name: CI
# This job is the single source of truth for the checks that judge a change.
# Keep the steps, the `checks` context, and the list in docs/ci-cd.md together.

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    name: checks
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          # backend/ is a private submodule; this read-only deploy key reads it.
          ssh-key: ${{ secrets.DBRAINX_BACKEND_TOKEN }}
      - name: Check out the private backend submodule
        run: git submodule update --init backend
      - uses: pnpm/action-setup@fe02b34f77f8bc703788d5817da081398fad5dd2
        with:
          version: 9.0.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .node-version
          cache: pnpm
      - name: Install media tools
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: pnpm install --frozen-lockfile
      - run: node scripts/release/download-pocketbase.mjs
      - run: pnpm release:check
      - run: pnpm check-types
      - run: pnpm lint:gate
      - run: pnpm test:release
      # `test-manifest.mjs` excludes these files from the release tests and
      # names these runners as their replacement, so CI has to run them.
      - run: pnpm test:ui
      - run: pnpm --filter @workspace/services test
      - run: pnpm build
      # The built server runs the isolated two-user smoke test here. A version
      # tag cannot be moved or deleted, so a server regression must fail on the
      # pull request, not on the tag build.
      - run: pnpm smoke:server
      - run: bash scripts/release/check-workflows.sh
