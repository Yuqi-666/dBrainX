name: Desktop candidate build
on:
  workflow_dispatch:
    inputs:
      targets:
        description: A comma-separated part of the declared targets, or empty for all of them
        type: string
        default: ""
      signed:
        description: Build signed candidates using release environment secrets
        type: boolean
        default: false
  workflow_call:
    inputs:
      targets:
        type: string
        default: ""
      signed:
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: desktop-${{ github.workflow }}-${{ github.ref }}-${{ inputs.targets || 'declared' }}
  cancel-in-progress: ${{ github.workflow == 'Desktop candidate build' }}
jobs:
  plan:
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.resolve.outputs.matrix }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .node-version
      - name: Resolve the selected targets
        id: resolve
        shell: bash
        env:
          DESKTOP_TARGETS: ${{ inputs.targets }}
        run: |
          set -euo pipefail
          targets="$(node scripts/release/platforms.mjs select desktop "$DESKTOP_TARGETS")"
          echo "matrix=$(node scripts/release/platforms.mjs matrix desktop "$targets")" >> "$GITHUB_OUTPUT"
  build:
    needs: plan
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    environment: candidate
    env:
      NODE_OPTIONS: --max-old-space-size=4096
      CARGO_BUILD_JOBS: "2"
      DBRAINX_BUILD_SIGNED: ${{ inputs.signed }}
      DBRAINX_GIT_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@fe02b34f77f8bc703788d5817da081398fad5dd2
        with:
          version: 9.0.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Restore desktop Next.js build cache
        id: next-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: apps/desktop/.next/cache
          key: next-v1-${{ runner.os }}-${{ matrix.target }}-desktop-${{ hashFiles('.node-version', 'pnpm-lock.yaml') }}-${{ hashFiles('apps/**/*.ts', 'apps/**/*.tsx', 'apps/**/*.mjs', 'apps/**/*.js', 'apps/**/*.json', 'packages/**/*.ts', 'packages/**/*.tsx', 'packages/**/*.js', 'packages/**/*.mjs', 'packages/**/*.json', 'backend/**/*.ts', 'backend/**/*.json', 'scripts/**/*.mjs', 'apps/**/*.css', 'packages/**/*.css', 'packages/**/*.scss', 'apps/*/public/**', 'packages/*/public/**', '*.json', '*.yaml', '!**/node_modules/**', '!**/.next/**', '!**/dist/**', '!**/target/**', '!**/runtime/**') }}
          restore-keys: next-v1-${{ runner.os }}-${{ matrix.target }}-desktop-${{ hashFiles('.node-version', 'pnpm-lock.yaml') }}-
      - run: pnpm release:check
      - name: Require updater signing key
        if: inputs.signed
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: test -n "$TAURI_SIGNING_PRIVATE_KEY"
      - if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libssl-dev librsvg2-dev build-essential patchelf ffmpeg gstreamer1.0-tools gstreamer1.0-plugins-base gstreamer1.0-plugins-good gstreamer1.0-libav
      - if: runner.os == 'macOS'
        run: |
          brew install ffmpeg@7
          echo "FFMPEG_PATH=$(brew --prefix ffmpeg@7)/bin/ffmpeg" >> "$GITHUB_ENV"
          echo "FFPROBE_PATH=$(brew --prefix ffmpeg@7)/bin/ffprobe" >> "$GITHUB_ENV"
      - if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install ffmpeg --version=7.1.1 --allow-downgrade -y --no-progress
          $ffmpeg = Get-ChildItem C:\ProgramData\chocolatey\lib\ffmpeg -Filter ffmpeg.exe -Recurse | Select-Object -First 1
          $ffprobe = Get-ChildItem C:\ProgramData\chocolatey\lib\ffmpeg -Filter ffprobe.exe -Recurse | Select-Object -First 1
          if (!$ffmpeg -or !$ffprobe) { throw 'FFmpeg binaries missing' }
          "FFMPEG_PATH=$($ffmpeg.FullName)" >> $env:GITHUB_ENV
          "FFPROBE_PATH=$($ffprobe.FullName)" >> $env:GITHUB_ENV
      - run: rustup show active-toolchain
      - name: Restore Rust dependency build cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          workspaces: apps/desktop/src-tauri -> target
          prefix-key: dbrainx-rust-v1
          shared-key: ${{ matrix.target }}-${{ inputs.signed && 'signed' || 'unsigned' }}
          cache-workspace-crates: false
          cache-on-failure: false
          save-if: ${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
      - run: node scripts/release/download-pocketbase.mjs
      - if: inputs.signed && runner.os != 'Linux'
        run: node scripts/release/prepare-signing.mjs
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_PRIVATE_KEY: ${{ secrets.APPLE_API_PRIVATE_KEY }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
      - run: pnpm --filter desktop runtime:prepare
        env:
          APPLE_SIGNING_IDENTITY: ${{ inputs.signed && secrets.APPLE_SIGNING_IDENTITY || '' }}
      - run: node apps/desktop/scripts/backend-smoke.mjs
        timeout-minutes: 5
      - run: cargo test --locked --release --lib --manifest-path apps/desktop/src-tauri/Cargo.toml
      - name: Build installer
        shell: bash
        run: |
          # Tauri treats a present-but-empty identity as a request to sign.
          # Unsigned diagnostics must omit signing variables entirely.
          if [ "$RUNNER_OS" = "macOS" ] && [ "$DBRAINX_BUILD_SIGNED" != "true" ]; then
            unset APPLE_SIGNING_IDENTITY APPLE_API_KEY APPLE_API_ISSUER
          fi
          verbosity=()
          if [ "$RUNNER_OS" = "Linux" ]; then verbosity=(--verbose); fi
          configs=()
          if [ -n "${DBRAINX_TAURI_SIGNING_CONFIG:-}" ]; then configs+=(--config "$DBRAINX_TAURI_SIGNING_CONFIG"); fi
          if [ "$DBRAINX_BUILD_SIGNED" = "true" ]; then configs+=(--config '{"bundle":{"createUpdaterArtifacts":true}}'); fi
          pnpm --filter desktop tauri build --ci "${verbosity[@]}" "${configs[@]}" -- --locked
        env:
          APPLE_SIGNING_IDENTITY: ${{ inputs.signed && secrets.APPLE_SIGNING_IDENTITY || '' }}
          APPLE_API_KEY: ${{ inputs.signed && secrets.APPLE_API_KEY || '' }}
          APPLE_API_ISSUER: ${{ inputs.signed && secrets.APPLE_API_ISSUER || '' }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ inputs.signed && secrets.TAURI_SIGNING_PRIVATE_KEY || '' }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ inputs.signed && secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD || '' }}
      - if: runner.os == 'Linux'
        run: node scripts/release/verify-linux-package.mjs
      - if: inputs.signed && runner.os == 'macOS'
        shell: bash
        run: |
          shopt -s nullglob
          apps=(apps/desktop/src-tauri/target/release/bundle/macos/*.app)
          [ "${#apps[@]}" -gt 0 ] || { echo "No macOS app produced"; exit 1; }
          for app in "${apps[@]}"; do
            codesign --verify --deep --strict "$app"
            spctl --assess --type execute "$app"
          done
          echo "DBRAINX_SIGNING_VERIFIED=true" >> "$GITHUB_ENV"
      - if: inputs.signed && runner.os == 'Windows'
        shell: pwsh
        run: |
          $installers = @(Get-ChildItem apps/desktop/src-tauri/target/release/bundle -Recurse -File | Where-Object { $_.Extension -in '.exe', '.msi' })
          if ($installers.Count -eq 0) { throw 'No Windows installer produced' }
          foreach ($file in $installers) {
            $signature = Get-AuthenticodeSignature $file.FullName
            if ($signature.Status -ne 'Valid' -or $signature.SignerCertificate.Thumbprint -ne $env:DBRAINX_WINDOWS_THUMBPRINT) { throw "Invalid signature: $($file.Name)" }
          }
          "DBRAINX_SIGNING_VERIFIED=true" >> $env:GITHUB_ENV
      - run: node scripts/release/collect-desktop.mjs
      - name: Save desktop Next.js build cache
        if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && steps.next-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: apps/desktop/.next/cache
          key: ${{ steps.next-cache.outputs.cache-primary-key }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: desktop-${{ matrix.target }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: release-artifacts/${{ matrix.target }}/
          if-no-files-found: error
          retention-days: 30
      - if: always() && inputs.signed
        run: node scripts/release/cleanup-signing.mjs
